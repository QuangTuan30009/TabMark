<!doctype html>
<html lang="en" class="dark bg-background">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#080a10" />
    <meta name="description" content="Manage your bookmarks with AI-powered Kanban board" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>Tabmark - AI Bookmark Manager</title>
    <script>
      // Immediate OAuth Popup handler for Google Social Login
      // Captures tokens before any framework can alter window.location.hash
      (function() {
        try {
          if (window.opener && window.location.hash) {
            var hash = window.location.hash.substring(1);
            if (hash.indexOf('id_token=') !== -1 || hash.indexOf('access_token=') !== -1) {
              var params = new URLSearchParams(hash);
              var accessToken = params.get('access_token');
              var idToken = params.get('id_token');
              if (idToken) {
                window.opener.postMessage({
                  type: 'oauth-response',
                  provider: 'google',
                  accessToken: { token: accessToken || '' },
                  idToken: idToken,
                  responseType: 'online'
                }, window.location.origin);
                setTimeout(function() {
                  window.close();
                }, 50);
              }
            }
          }
        } catch (e) {
          console.warn('OAuth popup handler error:', e);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
